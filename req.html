<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <meta name="theme-color" content="#0b1220">
    <meta name="robots" content="noindex,nofollow">

    <title>ARINEX — Request</title>

    <!-- Pastikan file CSS retro pixelated yang baru ada di folder css/request.css -->
    <link rel="stylesheet" href="css/request.css">

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>

<body>
    <main class="request-shell">
        <section class="request-card" aria-live="polite">
            <div class="brand-mark">A</div>

            <!-- Tampilan Loading (Disederhanakan) -->
            <div id="loadingView">
                <div class="spinner" aria-hidden="true"></div>
                <h1>Request ke Server</h1>
                <p id="statusText" class="status-text">Memproses permintaan...</p>
            </div>

            <!-- Tampilan Hasil -->
            <div id="resultView" class="hidden">
                <div class="success-badge">✓</div>
                <div class="success-label">BERHASIL</div>

                <h2>Selesai</h2>
                <p class="result-note">
                    Token Anda
                </p>

                <!-- Informasi Device -->
                <div class="info-grid">
                    <div class="info-row">
                        <span>Device ID</span>
                        <strong id="resultDeviceId">-</strong>
                    </div>
                    <div class="info-row">
                        <span>Device</span>
                        <strong id="resultDeviceName">-</strong>
                    </div>
                    <div class="info-row">
                        <span>Model</span>
                        <strong id="resultModel">-</strong>
                    </div>
                    <div class="info-row">
                        <span>IP</span>
                        <strong id="resultIp">-</strong>
                    </div>
                </div>

                <!-- Form Token Simulasi -->
                <form id="tokenForm" class="token-form" autocomplete="off">
                    <label for="tokenInput">GitHub Token</label>
                    <div class="token-box">
                        <input
                            id="tokenInput"
                            type="text"
                            spellcheck="false"
                            readonly
                            placeholder="Token tersedia dari server"
                        >
                        <button type="button" id="copyBtn" class="copy-btn">COPY</button>
                    </div>
                    <p id="copyStatus" class="copy-status"></p>
                </form>
            </div>
        </section>
    </main>

    <script>
        "use strict";

        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCFsAAGRTW0et7_pQnxhLtkGR174kRqikg",
            authDomain: "arinexservice.firebaseapp.com",
            databaseURL: "https://arinexservice-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "arinexservice",
            storageBucket: "arinexservice.firebasestorage.app",
            messagingSenderId: "780762123532",
            appId: "1:780762123532:web:2c3b8a374eba5871490d29",
            measurementId: "G-SB9MXMZVCF"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ============================================================
        // UTILITIES
        // ============================================================
        const $ = (selector) => document.querySelector(selector);
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        function getOrCreateDeviceId() {
            const existing = localStorage.getItem("arinex_device_id");
            if (existing) return existing;

            const id = (crypto.randomUUID)
                ? crypto.randomUUID()
                : "dev-" + Date.now() + "-" + Math.random().toString(36).slice(2);

            localStorage.setItem("arinex_device_id", id);
            return id;
        }

        function getDeviceInfo() {
            const ua = navigator.userAgent || "";
            const platform = navigator.userAgentData?.platform || navigator.platform || "Unknown";

            let browserName = "Browser";
            if (/Edg\//i.test(ua)) browserName = "Microsoft Edge";
            else if (/Chrome\//i.test(ua)) browserName = "Google Chrome";
            else if (/Firefox\//i.test(ua)) browserName = "Mozilla Firefox";
            else if (/Safari\//i.test(ua) && !/Chrome\//i.test(ua)) browserName = "Safari";

            const mobile = /Android|iPhone|iPad|iPod/i.test(ua);

            return {
                deviceId: getOrCreateDeviceId(),
                deviceName: localStorage.getItem("arinex_device_name") ||
                    (mobile ? "Mobile Device" : "Desktop Device"),
                model: platform + " / " + browserName,
                userAgent: ua,
                language: navigator.language || "unknown",
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "unknown"
            };
        }

        async function getNetworkIp() {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);
                const response = await fetch("https://api.ipify.org?format=json", {
                    method: "GET",
                    cache: "no-store",
                    signal: controller.signal
                });
                clearTimeout(timeout);
                if (!response.ok) throw new Error("IP request failed");
                const data = await response.json();
                return data.ip || "Tidak tersedia";
            } catch (error) {
                return "Tidak tersedia";
            }
        }

        function setStatus(text) {
            $("#statusText").textContent = text;
        }

        async function saveRequestToFirebase(payload) {
            const ref = db.ref("requests").push();
            await ref.set({
                ...payload,
                firebaseKey: ref.key,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            });
            return ref.key;
        }

        function showResult(data, token) {
            $("#loadingView").classList.add("hidden");
            $("#resultView").classList.remove("hidden");

            $("#resultDeviceId").textContent = data.deviceId;
            $("#resultDeviceName").textContent = data.deviceName;
            $("#resultModel").textContent = data.model;
            $("#resultIp").textContent = data.ip || "Tidak tersedia";

            if (token) {
                $("#tokenInput").value = token;
            } else {
                $("#tokenInput").value = "";
                $("#tokenInput").placeholder = "Token belum tersedia";
            }
        }

        // ============================================================
        // MAIN FLOW
        // ============================================================
        async function runFlow() {
            setStatus("Mengumpulkan...");
            
            // Simulasi loading 1.5 detik agar animasi memutar terlihat
            await sleep(1500); 

            const device = getDeviceInfo();
            const ip = await getNetworkIp();

            const requestData = {
                deviceId: device.deviceId,
                deviceName: device.deviceName,
                model: device.model,
                ip: ip,
                userAgent: device.userAgent,
                language: device.language,
                screen: device.screen,
                timezone: device.timezone
            };

            setStatus("Mengirim data ke server...");

            try {
                const firebaseKey = await saveRequestToFirebase(requestData);
                requestData.firebaseKey = firebaseKey;
            } catch (error) {
                console.error(error);
                // Walaupun gagal menyimpan, flow tetap dilanjutkan untuk keperluan simulasi
            }

            setStatus("Permintaan berhasil!");
            await sleep(500);

            // ============================================================
            // TOKEN SIMULASI (HARDCODED)
            // ============================================================
            const simulatedToken = "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";
            
            showResult(requestData, simulatedToken);
        }

        // ============================================================
        // COPY BUTTON LOGIC
        // ============================================================
        $("#copyBtn").addEventListener("click", async () => {
            const input = $("#tokenInput");
            const token = input.value.trim();

            if (!token) {
                $("#copyStatus").textContent = "Token tidak tersedia.";
                return;
            }

            try {
                await navigator.clipboard.writeText(token);
                $("#copyStatus").textContent = "Token berhasil disalin.";
            } catch {
                // Fallback untuk browser lawas
                input.focus();
                input.select();
                document.execCommand("copy");
                $("#copyStatus").textContent = "Token berhasil disalin.";
            }

            setTimeout(() => {
                $("#copyStatus").textContent = "";
            }, 2200);
        });

        // Jalankan saat halaman dibuka
        runFlow().catch(error => {
            console.error(error);
            setStatus("Request mengalami kendala. Silakan muat ulang.");
        });
    </script>
</body>
</html>
