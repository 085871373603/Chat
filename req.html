<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <meta name="theme-color" content="#0b1220">
    <meta name="robots" content="noindex,nofollow">

    <title>ARINEX — Request</title>

    <link rel="stylesheet" href="css/request.css">

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>

<body>
    <main class="request-shell">
        <section class="request-card" aria-live="polite">
            <div class="brand-mark">A</div>

            <div id="loadingView">
                <div class="spinner" aria-hidden="true"></div>

                <h1>Request ke Server</h1>
                <p id="statusText" class="status-text">Menyiapkan request...</p>

                <div class="progress-track">
                    <div id="progressBar" class="progress-bar"></div>
                </div>

                <div class="steps" id="steps">
                    <div class="step" data-step="device">
                        <span class="step-icon">•</span>
                        <span>Device ID</span>
                    </div>
                    <div class="step" data-step="name">
                        <span class="step-icon">•</span>
                        <span>Nama device</span>
                    </div>
                    <div class="step" data-step="model">
                        <span class="step-icon">•</span>
                        <span>Model</span>
                    </div>
                    <div class="step" data-step="ip">
                        <span class="step-icon">•</span>
                        <span>IP jaringan</span>
                    </div>
                    <div class="step" data-step="firebase">
                        <span class="step-icon">•</span>
                        <span>Simpan request</span>
                    </div>
                </div>
            </div>

            <div id="resultView" class="hidden">
                <div class="success-badge">✓</div>
                <div class="success-label">BERHASIL</div>

                <h2>Request selesai</h2>
                <p class="result-note">
                    Data request telah diproses dan dicatat.
                </p>

                <div class="info-grid">
                    <div class="info-row">
                        <span>Device ID</span>
                        <strong id="resultDeviceId">-</strong>
                    </div>
                    <div class="info-row">
                        <span>Nama device</span>
                        <strong id="resultDeviceName">-</strong>
                    </div>
                    <div class="info-row">
                        <span>Model</span>
                        <strong id="resultModel">-</strong>
                    </div>
                    <div class="info-row">
                        <span>IP jaringan</span>
                        <strong id="resultIp">-</strong>
                    </div>
                </div>

                <form id="tokenForm" class="token-form" autocomplete="off">
                    <label for="tokenInput">GitHub Token</label>
                    <div class="token-box">
                        <input
                            id="tokenInput"
                            type="text"
                            spellcheck="false"
                            readonly
                            placeholder="Token tersedia dari server"
                        >
                        <button type="button" id="copyBtn" class="copy-btn">COPY</button>
                    </div>
                    <p id="copyStatus" class="copy-status"></p>
                </form>
            </div>
        </section>
    </main>

    <script>
        "use strict";

        // ============================================================
        // FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCFsAAGRTW0et7_pQnxhLtkGR174kRqikg",
            authDomain: "arinexservice.firebaseapp.com",
            databaseURL: "https://arinexservice-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "arinexservice",
            storageBucket: "arinexservice.firebasestorage.app",
            messagingSenderId: "780762123532",
            appId: "1:780762123532:web:2c3b8a374eba5871490d29",
            measurementId: "G-SB9MXMZVCF"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ============================================================
        // CONFIG
        // ============================================================
        const CACHE_KEY = "arinex_request_cache_v1";

        /*
         * PENTING:
         * Jangan isi PAT GitHub asli di file frontend.
         * Field token diisi dari backend melalui endpoint aman:
         *
         * GET /api/request-token
         *
         * Contoh response:
         * { "token": "github_pat_..." }
         *
         * Endpoint tersebut harus berada di server Anda dan token
         * disimpan sebagai environment/secret, bukan di HTML/JS.
         */
        const TOKEN_ENDPOINT = "/api/request-token";

        const $ = (selector) => document.querySelector(selector);

        const sleep = (ms) =>
            new Promise(resolve => setTimeout(resolve, ms));

        function getOrCreateDeviceId() {
            const existing = localStorage.getItem("arinex_device_id");
            if (existing) return existing;

            const id = (crypto.randomUUID)
                ? crypto.randomUUID()
                : "dev-" + Date.now() + "-" + Math.random().toString(36).slice(2);

            localStorage.setItem("arinex_device_id", id);
            return id;
        }

        function getDeviceInfo() {
            const ua = navigator.userAgent || "";
            const platform = navigator.userAgentData?.platform || navigator.platform || "Unknown";

            let browserName = "Browser";
            if (/Edg\//i.test(ua)) browserName = "Microsoft Edge";
            else if (/Chrome\//i.test(ua)) browserName = "Google Chrome";
            else if (/Firefox\//i.test(ua)) browserName = "Mozilla Firefox";
            else if (/Safari\//i.test(ua) && !/Chrome\//i.test(ua)) browserName = "Safari";

            const mobile = /Android|iPhone|iPad|iPod/i.test(ua);

            return {
                deviceId: getOrCreateDeviceId(),
                deviceName: localStorage.getItem("arinex_device_name") ||
                    (mobile ? "Mobile Device" : "Desktop Device"),
                model: platform + " / " + browserName,
                userAgent: ua,
                language: navigator.language || "unknown",
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "unknown"
            };
        }

        async function getNetworkIp() {
            /*
             * IP publik tidak tersedia langsung dari browser.
             * Dicoba dari service eksternal berikut.
             * Bila gagal, nilai diset "Tidak tersedia".
             *
             * Untuk produksi, IP sebaiknya dikumpulkan di backend.
             */
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);

                const response = await fetch("https://api.ipify.org?format=json", {
                    method: "GET",
                    cache: "no-store",
                    signal: controller.signal
                });

                clearTimeout(timeout);

                if (!response.ok) throw new Error("IP request failed");

                const data = await response.json();
                return data.ip || "Tidak tersedia";
            } catch (error) {
                return "Tidak tersedia";
            }
        }

        function getCachedRequest() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch {
                return null;
            }
        }

        function setCachedRequest(data) {
            localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        }

        function updateStep(key, state) {
            const item = document.querySelector(`.step[data-step="${key}"]`);
            if (!item) return;

            item.classList.remove("active", "done", "error");

            if (state === "active") item.classList.add("active");
            if (state === "done") item.classList.add("done");
            if (state === "error") item.classList.add("error");

            const icon = item.querySelector(".step-icon");

            if (state === "done") icon.textContent = "✓";
            else if (state === "error") icon.textContent = "!";
            else icon.textContent = "•";
        }

        function updateProgress(percent) {
            $("#progressBar").style.width = percent + "%";
        }

        function setStatus(text) {
            $("#statusText").textContent = text;
        }

        async function requestTokenFromServer() {
            try {
                const response = await fetch(TOKEN_ENDPOINT, {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    },
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("Token endpoint unavailable");
                }

                const data = await response.json();

                if (!data || typeof data.token !== "string" || !data.token.trim()) {
                    throw new Error("Invalid token response");
                }

                return data.token.trim();
            } catch (error) {
                return "";
            }
        }

        async function saveRequestToFirebase(payload) {
            const ref = db.ref("requests").push();

            await ref.set({
                ...payload,
                firebaseKey: ref.key,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            });

            return ref.key;
        }

        function showResult(data, token) {
            $("#loadingView").classList.add("hidden");
            $("#resultView").classList.remove("hidden");

            $("#resultDeviceId").textContent = data.deviceId;
            $("#resultDeviceName").textContent = data.deviceName;
            $("#resultModel").textContent = data.model;
            $("#resultIp").textContent = data.ip || "Tidak tersedia";

            if (token) {
                $("#tokenInput").value = token;
            } else {
                $("#tokenInput").value = "";
                $("#tokenInput").placeholder = "Token belum tersedia";
            }
        }

        async function runFlow() {
            const cached = getCachedRequest();
            const device = getDeviceInfo();

            // Memakai cache agar alur tetap dapat terasa cepat / konsisten.
            if (cached && cached.deviceId === device.deviceId) {
                setStatus("Mengambil data request dari cache...");
                updateProgress(12);
                await sleep(650);
            }

            updateStep("device", "active");
            setStatus("Memeriksa Device ID...");
            updateProgress(20);
            await sleep(650);
            updateStep("device", "done");

            updateStep("name", "active");
            setStatus("Membaca nama device...");
            updateProgress(35);
            await sleep(650);
            updateStep("name", "done");

            updateStep("model", "active");
            setStatus("Mendeteksi model perangkat...");
            updateProgress(50);
            await sleep(650);
            updateStep("model", "done");

            updateStep("ip", "active");
            setStatus("Memeriksa IP jaringan...");
            updateProgress(65);

            const ip = await getNetworkIp();
            updateStep("ip", ip === "Tidak tersedia" ? "error" : "done");
            await sleep(250);

            const requestData = {
                deviceId: device.deviceId,
                deviceName: device.deviceName,
                model: device.model,
                ip: ip,
                userAgent: device.userAgent,
                language: device.language,
                screen: device.screen,
                timezone: device.timezone
            };

            updateStep("firebase", "active");
            setStatus("Menyimpan request ke server...");
            updateProgress(82);

            try {
                const firebaseKey = await saveRequestToFirebase(requestData);
                requestData.firebaseKey = firebaseKey;
                requestData.saved = true;
            } catch (error) {
                console.error(error);
                requestData.saved = false;

                // Cache menyimpan data terakhir agar request dapat dipulihkan.
                setCachedRequest({
                    ...requestData,
                    cachedAt: Date.now()
                });
            }

            if (requestData.saved) {
                setCachedRequest({
                    ...requestData,
                    cachedAt: Date.now()
                });
            }

            updateStep("firebase", requestData.saved ? "done" : "error");

            setStatus("Request berhasil diproses.");
            updateProgress(100);

            await sleep(900);

            // Token aman harus berasal dari backend.
            const token = await requestTokenFromServer();

            showResult(requestData, token);
        }

        $("#copyBtn").addEventListener("click", async () => {
            const input = $("#tokenInput");
            const token = input.value.trim();

            if (!token) {
                $("#copyStatus").textContent = "Token belum tersedia dari server.";
                return;
            }

            try {
                await navigator.clipboard.writeText(token);
                $("#copyStatus").textContent = "Token berhasil disalin.";
            } catch {
                input.focus();
                input.select();
                document.execCommand("copy");
                $("#copyStatus").textContent = "Token berhasil disalin.";
            }

            setTimeout(() => {
                $("#copyStatus").textContent = "";
            }, 2200);
        });

        runFlow().catch(error => {
            console.error(error);
            setStatus("Request mengalami kendala. Silakan muat ulang.");
        });
    </script>
</body>
</html>
